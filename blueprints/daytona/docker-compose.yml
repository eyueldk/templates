name: daytona-dokploy

services:
  api:
    image: daytonaio/daytona-api
    ports:
      - 3000
    environment:
      OTEL_ENABLED: "true"
      OTEL_EXPORTER_OTLP_ENDPOINT: http://otel-collector:4318
      DEFAULT_SNAPSHOT: daytonaio/sandbox:0.5.0-slim
      ENCRYPTION_KEY: ${ENCRYPTION_KEY:?Set ENCRYPTION_KEY in .env}
      ENCRYPTION_SALT: ${ENCRYPTION_SALT:?Set ENCRYPTION_SALT in .env}
      NODE_ENV: production
      PORT: 3000
      DB_HOST: db
      DB_PORT: 5432
      DB_USERNAME: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      DB_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      DB_DATABASE: daytona
      REDIS_HOST: redis
      REDIS_PORT: 6379
      OIDC_CLIENT_ID: daytona
      OIDC_ISSUER_BASE_URL: http://dex:5556/dex
      PUBLIC_OIDC_DOMAIN: ${DAYTONA_PUBLIC_URL:?Set DAYTONA_PUBLIC_URL in .env}/dex
      OIDC_AUDIENCE: daytona
      OIDC_MANAGEMENT_API_ENABLED: ""
      OIDC_MANAGEMENT_API_CLIENT_ID: ""
      OIDC_MANAGEMENT_API_CLIENT_SECRET: ""
      OIDC_MANAGEMENT_API_AUDIENCE: ""
      DASHBOARD_URL: ${DAYTONA_PUBLIC_URL:?Set DAYTONA_PUBLIC_URL in .env}/dashboard
      DASHBOARD_BASE_API_URL: ${DAYTONA_PUBLIC_URL:?Set DAYTONA_PUBLIC_URL in .env}
      POSTHOG_API_KEY: ""
      POSTHOG_HOST: ""
      POSTHOG_ENVIRONMENT: self-hosted
      TRANSIENT_REGISTRY_URL: http://registry:6000
      TRANSIENT_REGISTRY_ADMIN: ${REGISTRY_USER:?Set REGISTRY_USER in .env}
      TRANSIENT_REGISTRY_PASSWORD: ${REGISTRY_PASSWORD:?Set REGISTRY_PASSWORD in .env}
      TRANSIENT_REGISTRY_PROJECT_ID: daytona
      INTERNAL_REGISTRY_URL: http://registry:6000
      INTERNAL_REGISTRY_ADMIN: ${REGISTRY_USER:?Set REGISTRY_USER in .env}
      INTERNAL_REGISTRY_PASSWORD: ${REGISTRY_PASSWORD:?Set REGISTRY_PASSWORD in .env}
      INTERNAL_REGISTRY_PROJECT_ID: daytona
      SMTP_HOST: ${SMTP_HOST:?Set SMTP_HOST in .env}
      SMTP_PORT: ${SMTP_PORT:?Set SMTP_PORT in .env}
      SMTP_USER: ""
      SMTP_PASSWORD: ""
      SMTP_SECURE: ""
      SMTP_EMAIL_FROM: ${SMTP_EMAIL_FROM:?Set SMTP_EMAIL_FROM in .env}
      S3_ENDPOINT: http://minio:9000
      S3_STS_ENDPOINT: http://minio:9000/minio/v1/assume-role
      S3_REGION: us-east-1
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      S3_DEFAULT_BUCKET: daytona
      S3_ACCOUNT_ID: /
      S3_ROLE_NAME: /
      ENVIRONMENT: self-hosted
      MAX_AUTO_ARCHIVE_INTERVAL: "43200"
      MAINTENANCE_MODE: "false"
      PROXY_DOMAIN: ${PROXY_DOMAIN:?Set PROXY_DOMAIN in .env}
      PROXY_PROTOCOL: ${PROXY_PROTOCOL:?Set PROXY_PROTOCOL in .env}
      PROXY_API_KEY: ${PROXY_API_KEY:?Set PROXY_API_KEY in .env}
      PROXY_TEMPLATE_URL: ${PROXY_PROTOCOL:?Set PROXY_PROTOCOL in .env}://{{PORT}}-{{sandboxId}}.${PROXY_DOMAIN:?Set PROXY_DOMAIN in .env}
      DEFAULT_RUNNER_DOMAIN: runner
      DEFAULT_RUNNER_API_URL: http://runner:3003
      DEFAULT_RUNNER_PROXY_URL: http://runner:3003
      DEFAULT_RUNNER_API_KEY: ${RUNNER_API_KEY:?Set RUNNER_API_KEY in .env}
      DEFAULT_RUNNER_CPU: "4"
      DEFAULT_RUNNER_MEMORY: "8"
      DEFAULT_RUNNER_DISK: "50"
      DEFAULT_RUNNER_NAME: default
      DEFAULT_REGION_ID: us
      DEFAULT_REGION_NAME: us
      DEFAULT_REGION_ENFORCE_QUOTAS: "false"
      DEFAULT_ORG_QUOTA_TOTAL_CPU_QUOTA: "10000"
      DEFAULT_ORG_QUOTA_TOTAL_MEMORY_QUOTA: "10000"
      DEFAULT_ORG_QUOTA_TOTAL_DISK_QUOTA: "100000"
      DEFAULT_ORG_QUOTA_MAX_CPU_PER_SANDBOX: "100"
      DEFAULT_ORG_QUOTA_MAX_MEMORY_PER_SANDBOX: "100"
      DEFAULT_ORG_QUOTA_MAX_DISK_PER_SANDBOX: "1000"
      DEFAULT_ORG_QUOTA_SNAPSHOT_QUOTA: "1000"
      DEFAULT_ORG_QUOTA_MAX_SNAPSHOT_SIZE: "1000"
      DEFAULT_ORG_QUOTA_VOLUME_QUOTA: "10000"
      SSH_GATEWAY_API_KEY: ${SSH_GATEWAY_API_KEY:?Set SSH_GATEWAY_API_KEY in .env}
      SSH_GATEWAY_COMMAND: ssh -p 2222 {{TOKEN}}@${DAYTONA_HOST:?Set DAYTONA_HOST in .env}
      SSH_GATEWAY_PUBLIC_KEY: ${SSH_GATEWAY_PUBLIC_KEY:?Set SSH_GATEWAY_PUBLIC_KEY in .env}
      SSH_GATEWAY_URL: ${DAYTONA_HOST:?Set DAYTONA_HOST in .env}:2222
      RUNNER_DECLARATIVE_BUILD_SCORE_THRESHOLD: "10"
      RUNNER_AVAILABILITY_SCORE_THRESHOLD: "10"
      RUNNER_START_SCORE_THRESHOLD: "3"
      SKIP_USER_EMAIL_VERIFICATION: "true"
      RUN_MIGRATIONS: "true"
      OTEL_COLLECTOR_API_KEY: ${OTEL_COLLECTOR_API_KEY:?Set OTEL_COLLECTOR_API_KEY in .env}
      HEALTH_CHECK_API_KEY: ${HEALTH_CHECK_API_KEY:?Set HEALTH_CHECK_API_KEY in .env}
      CLICKHOUSE_HOST: ""
      CLICKHOUSE_PORT: ""
      CLICKHOUSE_DATABASE: ""
      CLICKHOUSE_USERNAME: ""
      CLICKHOUSE_PASSWORD: ""
      CLICKHOUSE_PROTOCOL: ""
    restart: unless-stopped
    privileged: true
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_started
      dex:
        condition: service_healthy
      registry:
        condition: service_started
      runner:
        condition: service_started
      otel-collector:
        condition: service_started
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 10
      start_period: 60s

  proxy:
    image: daytonaio/daytona-proxy
    environment:
      DAYTONA_API_URL: http://api:3000/api
      PROXY_PORT: 4000
      PROXY_API_KEY: ${PROXY_API_KEY:?Set PROXY_API_KEY in .env}
      PROXY_PROTOCOL: ${PROXY_PROTOCOL:?Set PROXY_PROTOCOL in .env}
      COOKIE_DOMAIN: ${PROXY_DOMAIN:?Set PROXY_DOMAIN in .env}
      OIDC_CLIENT_ID: daytona
      OIDC_CLIENT_SECRET: ""
      OIDC_DOMAIN: http://dex:5556/dex
      OIDC_PUBLIC_DOMAIN: ${DAYTONA_PUBLIC_URL:?Set DAYTONA_PUBLIC_URL in .env}/dex
      OIDC_AUDIENCE: daytona
      REDIS_HOST: redis
      REDIS_PORT: 6379
      TOOLBOX_ONLY_MODE: "false"
      PREVIEW_WARNING_ENABLED: "false"
    ports:
      - 4000
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy
      redis:
        condition: service_started
      dex:
        condition: service_healthy

  runner:
    image: daytonaio/daytona-runner
    environment:
      ENVIRONMENT: production
      API_PORT: 3003
      DAYTONA_RUNNER_TOKEN: ${RUNNER_API_KEY:?Set RUNNER_API_KEY in .env}
      LOG_FILE_PATH: /home/daytona/runner/runner.log
      RESOURCE_LIMITS_DISABLED: "true"
      AWS_ENDPOINT_URL: http://minio:9000
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      AWS_SECRET_ACCESS_KEY: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      AWS_DEFAULT_BUCKET: daytona
      DAYTONA_API_URL: http://api:3000/api
      RUNNER_DOMAIN: runner
      SSH_GATEWAY_ENABLE: "true"
      SSH_PUBLIC_KEY: ${SSH_GATEWAY_PUBLIC_KEY:?Set SSH_GATEWAY_PUBLIC_KEY in .env}
      INTER_SANDBOX_NETWORK_ENABLED: "false"
    ports:
      - 3003
    privileged: true
    restart: unless-stopped
    depends_on:
      minio:
        condition: service_started

  ssh-gateway:
    image: daytonaio/daytona-ssh-gateway
    environment:
      API_URL: http://api:3000/api
      API_KEY: ${SSH_GATEWAY_API_KEY:?Set SSH_GATEWAY_API_KEY in .env}
      SSH_PRIVATE_KEY: ${SSH_GATEWAY_PRIVATE_KEY:?Set SSH_GATEWAY_PRIVATE_KEY in .env}
      SSH_HOST_KEY: ${SSH_GATEWAY_HOST_KEY:?Set SSH_GATEWAY_HOST_KEY in .env}
      SSH_GATEWAY_PORT: 2222
    ports:
      - 2222
    restart: unless-stopped
    depends_on:
      api:
        condition: service_healthy

  dex-init:
    image: bhgedigital/envsubst:latest
    restart: "no"
    environment:
      DAYTONA_PUBLIC_URL: ${DAYTONA_PUBLIC_URL:?Set DAYTONA_PUBLIC_URL in .env}
      PROXY_PUBLIC_URL: ${PROXY_PUBLIC_URL:?Set PROXY_PUBLIC_URL in .env}
      DEX_ADMIN_EMAIL: ${DEX_ADMIN_EMAIL:?Set DEX_ADMIN_EMAIL in .env}
      DEX_ADMIN_PASSWORD_HASH: ${DEX_ADMIN_PASSWORD_HASH:?Set DEX_ADMIN_PASSWORD_HASH in .env}
    volumes:
      - dex_rendered_config:/config
    command:
      - sh
      - -c
      - |
        cat <<'TEMPLATE' | envsubst '$$DAYTONA_PUBLIC_URL $$PROXY_PUBLIC_URL $$DEX_ADMIN_EMAIL $$DEX_ADMIN_PASSWORD_HASH' > /config/config.yaml
        issuer: $${DAYTONA_PUBLIC_URL}/dex
        storage:
          type: sqlite3
          config:
            file: /var/dex/dex.db

        web:
          http: 0.0.0.0:5556
          allowedOrigins: ['*']
          allowedHeaders: ['x-requested-with']

        staticClients:
          - id: daytona
            redirectURIs:
              - '$${DAYTONA_PUBLIC_URL}'
              - '$${DAYTONA_PUBLIC_URL}/api/oauth2-redirect.html'
              - '$${DAYTONA_PUBLIC_URL}/callback'
              - '$${PROXY_PUBLIC_URL}/callback'
            name: 'Daytona'
            public: true

        enablePasswordDB: true
        staticPasswords:
          - email: '$${DEX_ADMIN_EMAIL}'
            hash: '$${DEX_ADMIN_PASSWORD_HASH}'
            username: 'admin'
            userID: '1234'
        TEMPLATE
        chmod 644 /config/config.yaml

  dex:
    image: dexidp/dex:v2.42.0
    depends_on:
      dex-init:
        condition: service_completed_successfully
    volumes:
      - dex_rendered_config:/etc/dex-config:ro
      - dex_db:/var/dex
    entrypoint: ['sh', '-c', 'touch /var/dex/dex.db && exec dex serve /etc/dex-config/config.yaml']
    ports:
      - 5556
    healthcheck:
      test: ["CMD", "wget", "--spider", "--quiet", "http://localhost:5556/dex/.well-known/openid-configuration"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 15s
    restart: unless-stopped

  db:
    image: postgres:18
    environment:
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
      POSTGRES_USER: ${POSTGRES_USER:?Set POSTGRES_USER in .env}
      POSTGRES_DB: daytona
    volumes:
      - db_data:/var/lib/postgresql/18/docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:?Set POSTGRES_USER in .env} -d daytona"]
      interval: 5s
      timeout: 5s
      retries: 12
    restart: unless-stopped

  redis:
    image: redis:latest
    restart: unless-stopped

  registry:
    image: registry:2.8.2
    restart: unless-stopped
    environment:
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Origin: '[http://registry-ui.example.com]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Methods: '[HEAD,GET,OPTIONS,DELETE]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Credentials: '[true]'
      REGISTRY_HTTP_HEADERS_Access-Control-Allow-Headers: '[Authorization,Accept,Cache-Control]'
      REGISTRY_HTTP_HEADERS_Access-Control-Expose-Headers: '[Docker-Content-Digest]'
      REGISTRY_STORAGE_DELETE_ENABLED: 'true'
      REGISTRY_HTTP_ADDR: registry:6000
    volumes:
      - registry:/var/lib/registry
    ports:
      - 6000

  minio:
    image: minio/minio:latest
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:?Set MINIO_ROOT_USER in .env}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:?Set MINIO_ROOT_PASSWORD in .env}
      MINIO_IDENTITY_STS_EXPIRY: '"24h"'
    volumes:
      - minio_data:/data
    command: server /data --console-address ":9001"
    ports:
      - 9000
      - 9001
    restart: unless-stopped

  otel-collector:
    image: otel/opentelemetry-collector-contrib:0.138.0
    configs:
      - source: otel_collector_config
        target: /etc/otelcol-contrib/config.yaml
    ports:
      - 4318
      - 4317
    restart: unless-stopped

  jaeger:
    image: jaegertracing/all-in-one:1.67.0
    ports:
      - 16686
      - 4317
    restart: unless-stopped

configs:
  otel_collector_config:
    content: |
      receivers:
        otlp:
          protocols:
            grpc:
              endpoint: 0.0.0.0:4317
            http:
              endpoint: 0.0.0.0:4318

      processors:
        batch:

      exporters:
        debug:
          verbosity: detailed

        prometheus:
          endpoint: 0.0.0.0:9090
          namespace: otel

        otlp/jaeger:
          endpoint: jaeger:4317
          tls:
            insecure: true

      service:
        pipelines:
          traces:
            receivers: [otlp]
            processors: [batch]
            exporters: [otlp/jaeger]

          metrics:
            receivers: [otlp]
            processors: [batch]
            exporters: [prometheus]

          logs:
            receivers: [otlp]
            processors: [batch]
            exporters: [debug]

volumes:
  registry: {}
  minio_data: {}
  db_data: {}
  dex_db: {}
  dex_rendered_config: {}
