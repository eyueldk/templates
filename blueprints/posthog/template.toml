[variables]
main_domain = "${domain}"
posthog_secret = "${password:32}"
encryption_salt_keys = "${password:32}"

[[config.domains]]
serviceName = "web"
port = 8000
host = "${main_domain}"

[config.env]
DOMAIN="${main_domain}"
POSTHOG_APP_TAG="latest"
REGISTRY_URL="posthog/posthog"
POSTHOG_SECRET="${posthog_secret}"
ENCRYPTION_SALT_KEYS="${encryption_salt_keys}"